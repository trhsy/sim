# 这是一个示例 mods.toml 文件。它包含了与加载模组相关的数据。
# 存在多个必填字段（#必填），以及更多可选字段（#选填）。
# 整体格式为标准TOML格式，版本0.5.0。
# 注意，此文件中包含几个TOML列表。
# 有关toml格式的更多信息，请访问：https://github.com/toml-lang/toml
# 要加载的模组加载器类型的名称 - 对于常规的 FML @Mod 模组，它应该是 javafml
modLoader="javafml" #必填
# 所述模组加载器所匹配的版本范围 - 对于常规的FML @Mod，它将是forge版本
loaderVersion="[25,)" #强制（当前Forge版本为24）
# 当此模组出现问题时，供人们参考的网址
issueTrackerURL="https://trhsy.github.io/" #选填
# 模组列表 - 这里允许的模组数量由各个模组加载器决定
[[mods]] #必填
# 该模组的模组ID
modId="sim" #必填
# 这个mod的版本号——这里可以使用几个众所周知的${}变量，或者直接硬编码
version="${file.jarVersion}" #必填
 # 该模组的一个显示名称
displayName="Simulated town" #必填
# 一个用于查询此模组更新的URL。请参阅JSON更新规范<here>
updateJSONURL="https://trhsy.github.io/" #选填
# 此模组“主页”的URL，显示在模组用户界面中
displayURL="https://trhsy.github.io/" #选填
# 一个包含显示用标志的文件名（位于模组JAR文件的根目录中）
logoFile="logo.png" #选填
# 模组用户界面中显示的文本框
credits="" #选填
# 模组用户界面中显示的文本框
authors="By TRHSY reset" #选填
# 该模组（多行！）的描述文本(#必填)
description='''
Sim city, you can employ them to Build, mine, farm, bake, terraform and much more! Contains over 200 houses and buildings for them to build and live in, get them to build your own designs and share them with other players.
'''
# A dependency - use the . to indicate dependency for a specific modid. Dependencies are 选填.
[[dependencies.examplemod]] #选填
    # 依赖项的模组ID
    modId="forge" #必填
    # below must be specified
    mandatory=true #必填
    # The version range of the dependency
    versionRange="[25,)" #必填
    # 如果关系不是依赖关系，则需要指定依赖关系的顺序——是“之前”还是“之后”必填
    ordering="NONE"
    # 此依赖项适用于以下两者：客户端或服务器
    side="BOTH"
# Here's another dependency
[[dependencies.examplemod]]
    modId="minecraft"
    mandatory=true
    versionRange="[1.13.2]"
    ordering="NONE"
    side="BOTH"